name: Python tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,model,viz,scraping,database]'
      - name: Record model dependency versions
        run: |
          python -c "import numpy, pandas, sklearn, scipy; print({m.__name__: m.__version__ for m in (numpy, pandas, sklearn, scipy)})"
      - run: python -m pytest -q
      - run: python -m build --wheel

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ff_ci
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: ff_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ff_ci -d ff_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: ff_ci
      DB_USER: ff_ci
      DB_PASSWORD: ci_fixture_only
      TEST_DATABASE_URL: postgresql+psycopg2://ff_ci:ci_fixture_only@localhost:5432/ff_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,database,dbt]'
      - run: python -m pytest tests/test_sql_upsert.py -q
      - run: python scripts/verify_database_ci.py

  report-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hosted dependencies and test runner
        run: python -m pip install -e '.[model,scraping]' 'pytest>=8,<9'
      - name: Check optional dependencies stay optional
        run: |
          python - <<'PY'
          from importlib.util import find_spec
          assert find_spec('plotly') is None, 'Hosted runtime must not require viz'
          assert find_spec('sqlalchemy') is None, 'Hosted runtime must not require database'
          import fantasyfootball.reports.hosted
          PY
      - name: Exercise report preparation and delivery boundaries offline
        run: python -m pytest tests/test_hosted.py tests/test_lineup_email.py tests/test_waivers.py tests/test_waiver_comparisons.py tests/test_waiver_roles.py -q
