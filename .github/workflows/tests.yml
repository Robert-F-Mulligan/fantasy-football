name: Python tests
on:
  pull_request:
  push:
    branches: [main, refactor/predictive-draft-platform]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      LOKY_MAX_CPU_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,model,viz,scraping,database]'
      - name: Record model dependency versions
        run: |
          python -c "import numpy, pandas, sklearn, scipy; print({m.__name__: m.__version__ for m in (numpy, pandas, sklearn, scipy)})"
      - run: python -m pytest -q
      - run: python -m build --wheel

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ff_ci
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: ff_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ff_ci -d ff_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: ff_ci
      DB_USER: ff_ci
      DB_PASSWORD: ci_fixture_only
      TEST_DATABASE_URL: postgresql+psycopg2://ff_ci:ci_fixture_only@localhost:5432/ff_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,database,dbt]'
      - run: python -m pytest tests/test_sql_upsert.py -q
      - run: python scripts/verify_database_ci.py
